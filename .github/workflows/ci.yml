name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: pytest -q

      - name: Test CLI
        run: |
          python -m xtract.cli test_cases/solidity/SimpleStorage.sol /tmp/test_output.rs
          test -f /tmp/test_output.rs
          grep "SimpleStorage" /tmp/test_output.rs
